# Source-code candidate rules. Output is a list of CANDIDATES for manual review, not findings.
# type: line (regex per line) | file_missing (file has `present` but lacks `absent`)
# Control IDs match the 'Master Checklist' sheet of the review tracker.
rules:
  - {id: SRC-001, name: Custom servlet or filter, type: line, ext: [java, gs, gsx, xml], regex: '(extends\s+(\w+\.)*HttpServlet|javax\.servlet\.|jakarta\.servlet\.|<servlet>)', control: GW-CFG-029, severity: High, note: "Guidewire guidance is not to use custom servlets."}
  - {id: SRC-002, name: Direct JDBC / DB access, type: line, ext: [java, gs, gsx, gst], regex: '(java\.sql\.|DriverManager|\.getConnection\(|createStatement\()', control: GW-COD-003, severity: High, note: "Direct database access bypasses the platform query layer (IS-TLS-1238)."}
  - {id: SRC-003, name: String-built SQL, type: line, ext: [java, gs, gsx, gst], regex: '(?i)("[^"]*\b(select\s.+\sfrom|insert\s+into|update\s+\w+\s+set|delete\s+from)\b[^"]*"|''[^'']*\b(select\s.+\sfrom|insert\s+into|update\s+\w+\s+set|delete\s+from)\b[^'']*'')\s*\+', control: GW-COD-003, severity: High, note: "Check whether user input reaches the query."}
  - {id: SRC-004, name: Dynamic code execution, type: line, ext: [java, gs, gsx, gst], regex: '(\beval\s*\(|\bevaluate\s*\(|GosuShell|GosuClassLoader)', control: GW-COD-005, severity: High}
  - {id: SRC-005, name: OS command execution, type: line, ext: [java, gs, gsx, gst], regex: '(Runtime\.getRuntime\(\)\.exec|new\s+ProcessBuilder|ProcessBuilder\()', control: GW-COD-006, severity: High}
  - {id: SRC-006, name: Unsafe deserialisation, type: line, ext: [java, gs, gsx, gst], regex: '(ObjectInputStream|XStream|enableDefaultTyping|activateDefaultTyping|new\s+Yaml\(|\.readObject\()', control: GW-COD-007, severity: High}
  - {id: SRC-007, name: XML parser (check DTD / external entity settings), type: line, ext: [java, gs, gsx, gst], regex: '(DocumentBuilderFactory\.newInstance|SAXParserFactory\.newInstance|XMLInputFactory\.newInstance|SAXReader|TransformerFactory\.newInstance)', control: GW-COD-008, severity: Medium}
  - {id: SRC-008, name: File path from variable, type: line, ext: [java, gs, gsx, gst], regex: '(new\s+File\(|Paths\.get\(|FileInputStream\(|FileOutputStream\()', control: GW-COD-009, severity: Low, note: "Noisy: review where the path comes from."}
  - {id: SRC-009, name: Outbound HTTP call, type: line, ext: [java, gs, gsx, gst], regex: '(new\s+URL\(|HttpURLConnection|openConnection\(|HttpClient)', control: GW-COD-010, severity: Medium}
  - {id: SRC-010, name: Hard-coded credential, type: line, ext: ['*'], regex: '(?i)(password|passwd|pwd|secret|api[_-]?key|client[_-]?secret|access[_-]?token)\s*[:=]\s*["''][^"''\s$#{]{6,}["'']', control: GW-COD-014, severity: High, secret: true}
  - {id: SRC-011, name: Private key in source, type: line, ext: ['*'], regex: '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----', control: GW-COD-014, severity: High, secret: true}
  - {id: SRC-012, name: Cloud access key, type: line, ext: ['*'], regex: 'AKIA[0-9A-Z]{16}', control: GW-COD-014, severity: High, secret: true}
  - {id: SRC-013, name: Weak crypto or insecure randomness, type: line, ext: [java, gs, gsx, gst], regex: '(?i)(MessageDigest\.getInstance\(\s*["''](MD5|SHA-?1)["'']|Cipher\.getInstance\(\s*["''](DES|DESede|RC4)|Cipher\.getInstance\(\s*["''][^"'']*ECB|new\s+Random\(|Math\.random\()', control: GW-COD-015, severity: High}
  - {id: SRC-014, name: TLS validation disabled or custom trust, type: line, ext: [java, gs, gsx, gst, js, ts], regex: '(?i)(X509TrustManager|HostnameVerifier|ALLOW_ALL_HOSTNAME|TrustAllCerts|InsecureTrustManager|checkServerTrusted|rejectUnauthorized\s*:\s*false)', control: GW-INT-011, severity: High}
  - {id: SRC-015, name: Elevated privilege / run-as pattern, type: line, ext: [java, gs, gsx, gst], regex: '(UnrestrictedUser|getUnrestrictedUser|runAsUser)', control: GW-COD-013, severity: Medium, note: "Allowed only where justified."}
  - {id: SRC-016, name: Reflection / dynamic class loading, type: line, ext: [java, gs, gsx, gst], regex: '(Class\.forName|URLClassLoader|getDeclaredMethod|setAccessible\(\s*true\s*\))', control: GW-COD-033, severity: Medium}
  - {id: SRC-017, name: Print / stack trace instead of logger, type: line, ext: [java, gs, gsx, gst], regex: '(System\.(out|err)\.print|printStackTrace\(|(?<![\w.])print\s*\()', control: GW-LOG-004, severity: Low}
  - {id: SRC-018, name: Unsafe front-end sink or token storage, type: line, ext: [js, jsx, ts, tsx, html], regex: '(dangerouslySetInnerHTML|\.innerHTML\s*=|localStorage\.setItem|sessionStorage\.setItem|document\.write\()', control: GW-COD-027, severity: Medium}
  - {id: SRC-019, name: npm lifecycle script, type: line, ext: [json], regex: '"(preinstall|install|postinstall)"\s*:', control: GW-COD-029, severity: Medium}
  - {id: SRC-020, name: Hard-coded user exemption, type: line, ext: [java, gs, gsx, gst], regex: '(?i)(getName\(\)|getUserName\(\)|getUsername\(\))\s*(==|\.equals\()\s*\(?\s*["''](su|admin|superuser|system)["'']', control: GW-COD-017, severity: High}
  - {id: SRC-021, name: Fail-open catch block, type: line, ext: [java, gs, gsx, gst], regex: 'catch\s*\([^)]*\)\s*\{\s*return\s+true', control: GW-COD-016, severity: High}
  - {id: SRC-022, name: Debug / backdoor marker, type: line, ext: [java, gs, gsx, gst, properties, xml], regex: '(?i)(backdoor|debug\s*=\s*true|DEBUG_MODE|enableDebug)', control: GW-COD-024, severity: Low}
  - {id: SRC-023, name: PCF page without canVisit, type: file_missing, ext: [pcf], present: '<Page\b', absent: 'canVisit\s*=', control: GW-AZN-007, severity: High, note: "Page may lack a permission check."}
  - {id: SRC-024, name: Web service without WsiPermissions, type: file_missing, ext: [java, gs, gsx], present: '@WsiWebService', absent: '@WsiPermissions', control: GW-AZN-008, severity: High, note: "Check each operation for permission annotations."}
