server { listen 80; server_name __HOST__; return 301 https://$host$request_uri; }
server {
    listen 443 ssl;
    server_name __HOST__;
    ssl_certificate     /etc/pki/gwreview/tls.crt;
    ssl_certificate_key /etc/pki/gwreview/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 300m;          # source archive uploads
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;       # WebSocket for the live sign-in view
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
